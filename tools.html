<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GuitarLearn | Tools</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Lato&display=swap" rel="stylesheet">
  <style>
    /* ======= GLOBAL STYLE ======= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Lato', sans-serif;
      background-color: #121212;
      color: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 60px 20px;
      animation: fadeIn 0.8s ease-in;
    }

    h1, h2 {
      font-family: 'Poppins', sans-serif;
    }

    /* ======= HERO ======= */
    .hero {
      text-align: center;
      margin-bottom: 50px;
      animation: fadeDown 0.7s ease-in;
    }

    .hero h1 {
      font-size: 2.5rem;
      color: #FFA500;
      margin-bottom: 10px;
    }

    .hero p {
      color: #ccc;
      font-size: 1.1rem;
    }

    /* ======= TABS MENU ======= */
    .tabs {
      display: flex;
      justify-content: center;
      background: #1e1e1e;
      border-radius: 8px;
      overflow: hidden;
      width: 100%;
      max-width: 700px;
      margin-bottom: 30px;
    }

    .tab-button {
      flex: 1;
      padding: 15px 0;
      background: transparent;
      border: none;
      color: #bbb;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .tab-button:hover {
      color: #FFA500;
      background-color: #222;
    }

    .tab-button.active {
      color: #121212;
      background-color: #FFA500;
    }

    /* ======= TAB CONTENT ======= */
    .tab-content {
      display: none;
      max-width: 700px;
      width: 100%;
      background: #1a1a1a;
      padding: 40px 30px;
      border-radius: 10px;
      animation: fadeUp 0.6s ease;
    }

    .tab-content.active {
      display: block;
    }

    /* ======= TUNER ======= */
    .tuner-display {
      text-align: center;
    }

    .tuner-display img {
      width: 150px;
      opacity: 0.9;
      margin-bottom: 20px;
    }

    .tuner-frequency {
      font-size: 1.3rem;
      margin-top: 10px;
      color: #FFA500;
    }

    /* ======= METRONOME ======= */
    .metronome {
      text-align: center;
    }

    .metronome-bpm {
      font-size: 3rem;
      color: #FFA500;
      margin-bottom: 20px;
    }

    .bpm-slider {
      width: 100%;
      margin-bottom: 15px;
    }

    .beat-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background-color: #FFA500;
      margin: 20px auto;
      opacity: 0.2;
      transition: opacity 0.1s ease;
    }

    /* ======= CHORD LIBRARY ======= */
    .chord-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 20px;
    }

    .chord-card {
      background-color: #222;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      font-weight: 600;
      color: #f5f5f5;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .chord-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 10px rgba(255, 165, 0, 0.4);
      color: #FFA500;
    }

    /* ======= MODAL ======= */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      animation: fadeIn 0.3s ease;
    }

    .modal-content {
      background-color: #1e1e1e;
      padding: 30px;
      border-radius: 10px;
      width: 300px;
      text-align: center;
      animation: fadeUp 0.4s ease;
    }

    .modal-content img {
      width: 100%;
      border-radius: 5px;
      margin-bottom: 15px;
    }

    .close-btn {
      background: #FFA500;
      border: none;
      color: #121212;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .close-btn:hover {
      background: #fff;
    }

    /* ======= ANIMATIONS ======= */
    @keyframes fadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <section class="hero">
    <h1>Alat Bantu Gitar Digital</h1>
    <p>Temukan tuner, metronom, dan pustaka chord dalam satu tempat.</p>
  </section>

  <!-- Tabs Menu -->
  <div class="tabs">
    <button class="tab-button active" data-tab="tuner">🎵 Tuner</button>
    <button class="tab-button" data-tab="metronome">🕒 Metronome</button>
    <button class="tab-button" data-tab="chords">🎸 Chord Library</button>
  </div>

  <!-- Tab Content: Tuner -->
  <div id="tuner" class="tab-content active">
    <div class="tuner-display">
      <img src="https://cdn-icons-png.flaticon.com/512/921/921489.png" alt="Tuner Icon">
      <p>Aktifkan mikrofon untuk mendeteksi nada secara real-time.</p>
      <button class="close-btn">Mulai Tuning</button>
      <div class="tuner-frequency">🎸 Nada Terdeteksi: A4 (440 Hz)</div>
    </div>
  </div>

  <!-- Tab Content: Metronome -->
  <div id="metronome" class="tab-content">
    <div class="metronome">
      <div class="metronome-bpm" id="bpmValue">100 BPM</div>
      <input type="range" min="60" max="200" value="100" class="bpm-slider" id="bpmSlider">
      <button class="close-btn" id="startMetronome">Mulai</button>
      <div class="beat-dot" id="beatDot"></div>
    </div>
  </div>

  <!-- Tab Content: Chords -->
  <div id="chords" class="tab-content">
    <div class="chord-grid">
      <div class="chord-card" data-chord="A">A</div>
      <div class="chord-card" data-chord="C">C</div>
      <div class="chord-card" data-chord="D">D</div>
      <div class="chord-card" data-chord="E">E</div>
      <div class="chord-card" data-chord="G">G</div>
      <div class="chord-card" data-chord="Am">Am</div>
      <div class="chord-card" data-chord="Em">Em</div>
      <div class="chord-card" data-chord="Dm">Dm</div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal" id="chordModal">
    <div class="modal-content">
      <h3 id="chordName">Chord A</h3>
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/A_major_chord_for_guitar.svg/200px-A_major_chord_for_guitar.svg.png" alt="Chord Diagram">
      <button class="close-btn" id="closeModal">Tutup</button>
    </div>
  </div>

  <script>
    // ===== TAB SWITCHING =====
    const tabButtons = document.querySelectorAll(".tab-button");
    const tabContents = document.querySelectorAll(".tab-content");

    tabButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        tabButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        const target = btn.getAttribute("data-tab");
        tabContents.forEach(tc => {
          tc.classList.remove("active");
          if (tc.id === target) tc.classList.add("active");
        });
      });
    });

    // ===== METRONOME (basic simulation) =====
    const bpmSlider = document.getElementById("bpmSlider");
    const bpmValue = document.getElementById("bpmValue");
    const startBtn = document.getElementById("startMetronome");
    const beatDot = document.getElementById("beatDot");
    let interval, isPlaying = false;

    bpmSlider.addEventListener("input", () => {
      bpmValue.textContent = bpmSlider.value + " BPM";
      if (isPlaying) startMetronome();
    });

    startBtn.addEventListener("click", () => {
      isPlaying = !isPlaying;
      startBtn.textContent = isPlaying ? "Berhenti" : "Mulai";
      if (isPlaying) startMetronome();
      else clearInterval(interval);
    });

    function startMetronome() {
      clearInterval(interval);
      const bpm = parseInt(bpmSlider.value);
      const intervalMs = 60000 / bpm;
      interval = setInterval(() => {
        beatDot.style.opacity = 1;
        setTimeout(() => beatDot.style.opacity = 0.2, 100);
      }, intervalMs);
    }

    // ===== CHORD MODAL =====
    const chordCards = document.querySelectorAll(".chord-card");
    const chordModal = document.getElementById("chordModal");
    const chordName = document.getElementById("chordName");
    const closeModal = document.getElementById("closeModal");

    chordCards.forEach(card => {
      card.addEventListener("click", () => {
        const name = card.getAttribute("data-chord");
        chordName.textContent = "Chord " + name;
        chordModal.style.display = "flex";
      });
    });

    closeModal.addEventListener("click", () => {
      chordModal.style.display = "none";
    });

    window.addEventListener("click", e => {
      if (e.target === chordModal) chordModal.style.display = "none";
    });
  </script>
</body>
</html>
